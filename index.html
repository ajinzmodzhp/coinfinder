<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peso Finder Web</title>
    <style>
        body { margin: 0; background: black; color: white; font-family: sans-serif; overflow: hidden; }
        #container { position: relative; width: 100vw; height: 100vh; }
        video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        #status { position: absolute; top: 20px; left: 20px; font-size: 24px; font-weight: bold; z-index: 10; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 5px; }
    </style>
    <!-- Fixed: Use a faster, more stable CDN for OpenCV.js -->
    <script async src="https://cdn.jsdelivr.net/npm/@techstark/opencv-js@4.8.0-release.1/dist/opencv.js" onload="onOpenCvReady();" type="text/javascript"></script>
</head>
<body>
    <div id="container">
        <div id="status">Loading OpenCV (please wait, this takes ~10 seconds)...</div>
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas"></canvas>
    </div>

    <script>
        let video = document.getElementById('video');
        let canvas = document.getElementById('canvas');
        let ctx = canvas.getContext('2d');
        let statusText = document.getElementById('status');
        let cvReady = false;

        // Safety net: If it takes more than 15 seconds, show an error
        setTimeout(() => {
            if (!cvReady) {
                statusText.innerText = "⚠️ OpenCV taking too long. Check your internet connection and refresh.";
            }
        }, 15000);

        // 1. Start the Camera
        async function startCamera() {
            try {
                // Facing mode 'environment' forces the REAR camera
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" } 
                });
                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    processVideo();
                };
            } catch (err) {
                statusText.innerText = "Camera Error: " + err.message;
            }
        }

        // 2. Process the video frames
        let src, dst, gray, hsv, circles;
        function processVideo() {
            if (!cvReady) return;

            src = new cv.Mat(video.videoHeight, video.videoWidth, cv.CV_8UC4);
            dst = new cv.Mat(video.videoHeight, video.videoWidth, cv.CV_8UC4);
            gray = new cv.Mat();
            hsv = new cv.Mat();
            circles = new cv.Mat();

            function frameLoop() {
                if (video.readyState === video.HAVE_ENOUGH_DATA) {
                    // Draw video frame to canvas
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    
                    // Read the canvas into OpenCV Mat
                    src.data.set(ctx.getImageData(0, 0, canvas.width, canvas.height).data);
                    
                    detect20Peso();

                    // Clear canvas and draw the video back (so OpenCV drawings show up)
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    
                    // Draw OpenCV Mat onto canvas
                    cv.imshow('canvas', dst);
                }
                requestAnimationFrame(frameLoop);
            }
            frameLoop();
        }

        function detect20Peso() {
            // Convert to Gray and HSV
            cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
            cv.cvtColor(src, hsv, cv.COLOR_RGBA2RGB);
            cv.cvtColor(hsv, hsv, cv.COLOR_RGB2HSV);
            
            // Blur
            let ksize = new cv.Size(5, 5);
            cv.GaussianBlur(gray, gray, ksize, 0, 0, cv.BORDER_DEFAULT);

            // Find Circles
            cv.HoughCircles(gray, circles, cv.HOUGH_GRADIENT, 1, gray.rows / 8, 100, 30, 40, 120);

            let found = false;
            // Loop through circles
            for (let i = 0; i < circles.cols; i++) {
                let x = circles.data32F[i * 3];
                let y = circles.data32F[i * 3 + 1];
                let radius = circles.data32F[i * 3 + 2];

                if (is20Peso(x, y, radius)) {
                    found = true;
                    // Draw green circle on dst (RGBA)
                    cv.circle(dst, new cv.Point(x, y), radius, new cv.Scalar(0, 255, 0, 255), 4);
                    cv.putText(dst, "20 PESOS", new cv.Point(x - 80, y), cv.FONT_HERSHEY_SIMPLEX, 1.2, new cv.Scalar(0, 255, 0, 255), 3);
                    break;
                }
            }
            statusText.innerText = found ? "✅ 20 PESOS DETECTED" : "🔍 Searching...";
        }

        function is20Peso(cx, cy, r) {
            let rInner = r * 0.4;
            let rOuterMin = r * 0.65;
            let rOuterMax = r * 0.85;

            let innerSatSum = 0, innerCount = 0;
            let outerSatSum = 0, outerHueSum = 0, outerCount = 0;

            for (let angle = 0; angle < 360; angle += 10) {
                let rad = angle * Math.PI / 180;

                // Inner
                let ix = Math.floor(cx + rInner * Math.cos(rad));
                let iy = Math.floor(cy + rInner * Math.sin(rad));
                if (ix >= 0 && iy >= 0 && ix < hsv.cols && iy < hsv.rows) {
                    let p = hsv.ucharPtr(iy, ix);
                    innerSatSum += p[1]; // Saturation
                    innerCount++;
                }

                // Outer
                let midR = (rOuterMin + rOuterMax) / 2;
                let ox = Math.floor(cx + midR * Math.cos(rad));
                let oy = Math.floor(cy + midR * Math.sin(rad));
                if (ox >= 0 && oy >= 0 && ox < hsv.cols && oy < hsv.rows) {
                    let p = hsv.ucharPtr(oy, ox);
                    outerHueSum += p[0]; // Hue
                    outerSatSum += p[1]; // Saturation
                    outerCount++;
                }
            }

            if (innerCount === 0 || outerCount === 0) return false;

            let innerSat = innerSatSum / innerCount;
            let outerSat = outerSatSum / outerCount;
            let outerHue = outerHueSum / outerCount;

            // Tune these thresholds for web!
            let isSilver = innerSat < 40;
            let isGold = outerSat > 45 && outerHue > 10 && outerHue < 40;

            return isSilver && isGold;
        }

        // 3. Init when OpenCV loads
        function onOpenCvReady() {
            cvReady = true;
            statusText.innerText = "OpenCV Loaded! Starting Camera...";
            startCamera();
        }
    </script>
</body>
</html>
