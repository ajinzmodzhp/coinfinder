<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peso Finder Web</title>
    <style>
        body { margin: 0; background: black; color: white; font-family: sans-serif; overflow: hidden; }
        #container { position: relative; width: 100vw; height: 100vh; }
        video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        #status { position: absolute; top: 20px; left: 20px; font-size: 24px; font-weight: bold; z-index: 10; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 5px; }
    </style>
    <script async src="https://cdn.jsdelivr.net/npm/@techstark/opencv-js@4.8.0-release.1/dist/opencv.js" onload="onOpenCvReady();" type="text/javascript"></script>
</head>
<body>
    <div id="container">
        <div id="status">Loading OpenCV...</div>
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas"></canvas>
    </div>

    <script>
        let video = document.getElementById('video');
        let canvas = document.getElementById('canvas');
        let ctx = canvas.getContext('2d');
        let statusText = document.getElementById('status');
        let cvReady = false;

        // --- PERFORMANCE VARIABLES ---
        let isProcessing = false; // Prevents overlapping calculations
        let lastDrawTime = 0;

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" } 
                });
                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    processVideo();
                };
            } catch (err) {
                statusText.innerHTML = "🚫 Camera Access Denied. Please allow permissions.";
            }
        }

        let src, dst, gray, hsv, circles;
        function processVideo() {
            if (!cvReady) return;

            src = new cv.Mat(video.videoHeight, video.videoWidth, cv.CV_8UC4);
            dst = new cv.Mat(video.videoHeight, video.videoWidth, cv.CV_8UC4);
            gray = new cv.Mat();
            hsv = new cv.Mat();
            circles = new cv.Mat();

            function frameLoop(timestamp) {
                // 1. Always draw the raw video to the canvas so it feels smooth
                if (video.readyState === video.HAVE_ENOUGH_DATA) {
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                    // 2. THROTTLE: Only run detection every 150ms (approx 6 times a second)
                    if (!isProcessing && (timestamp - lastDrawTime > 150)) {
                        lastDrawTime = timestamp;
                        isProcessing = true;

                        // Grab the frame data
                        src.data.set(ctx.getImageData(0, 0, canvas.width, canvas.height).data);
                        
                        // Run detection (this updates 'dst' with our circles)
                        detect20Peso();

                        // Draw the OpenCV frame over the video
                        cv.imshow('canvas', dst);
                        
                        isProcessing = false;
                    }
                }
                requestAnimationFrame(frameLoop);
            }
            requestAnimationFrame(frameLoop);
        }

        function detect20Peso() {
            src.copyTo(dst); // Start fresh

            // --- DOWNSCALING (MASSIVE SPEED BOOST) ---
            // We shrink the image to 50% size for the math, then scale it back
            let scale = 0.5;
            let smallSrc = new cv.Mat();
            let dsize = new cv.Size(src.cols * scale, src.rows * scale);
            cv.resize(src, smallSrc, dsize, 0, 0, cv.INTER_AREA);

            let smallGray = new cv.Mat();
            let smallHsv = new cv.Mat();
            cv.cvtColor(smallSrc, smallGray, cv.COLOR_RGBA2GRAY);
            cv.cvtColor(smallSrc, smallHsv, cv.COLOR_RGBA2RGB);
            cv.cvtColor(smallHsv, smallHsv, cv.COLOR_RGB2HSV);
            
            cv.GaussianBlur(smallGray, smallGray, new cv.Size(5, 5), 0, 0, cv.BORDER_DEFAULT);

            // Find circles in the SMALL image
            cv.HoughCircles(smallGray, circles, cv.HOUGH_GRADIENT, 1, smallGray.rows / 8, 100, 30, 5, 150);

            let bestCircle = null;
            let maxRadius = 0;

            for (let i = 0; i < circles.cols; i++) {
                let x = circles.data32F[i * 3];
                let y = circles.data32F[i * 3 + 1];
                let radius = circles.data32F[i * 3 + 2];

                if (is20Peso(x, y, radius, smallHsv)) {
                    if (radius > maxRadius) {
                        maxRadius = radius;
                        // Scale the coordinates back up to full size!
                        bestCircle = { 
                            x: x / scale, 
                            y: y / scale, 
                            r: radius / scale 
                        };
                    }
                }
            }

            // Draw on the full-size image
            if (bestCircle) {
                statusText.innerText = "✅ 20 PESOS DETECTED";
                cv.circle(dst, new cv.Point(bestCircle.x, bestCircle.y), bestCircle.r, new cv.Scalar(0, 255, 0, 255), 8);
            } else {
                statusText.innerText = "🔍 Searching...";
            }

            // Clean up memory so the phone doesn't crash
            smallSrc.delete();
            smallGray.delete();
            smallHsv.delete();
        }

        function is20Peso(cx, cy, r, hsvMat) {
            let rInner = r * 0.4;
            let rOuterMin = r * 0.65;
            let rOuterMax = r * 0.85;

            let innerSatSum = 0, innerCount = 0;
            let outerSatSum = 0, outerHueSum = 0, outerCount = 0;

            for (let angle = 0; angle < 360; angle += 20) { // Sampled every 20 degrees instead of 10 (faster)
                let rad = angle * Math.PI / 180;

                let ix = Math.floor(cx + rInner * Math.cos(rad));
                let iy = Math.floor(cy + rInner * Math.sin(rad));
                if (ix >= 0 && iy >= 0 && ix < hsvMat.cols && iy < hsvMat.rows) {
                    let p = hsvMat.ucharPtr(iy, ix);
                    innerSatSum += p[1];
                    innerCount++;
                }

                let midR = (rOuterMin + rOuterMax) / 2;
                let ox = Math.floor(cx + midR * Math.cos(rad));
                let oy = Math.floor(cy + midR * Math.sin(rad));
                if (ox >= 0 && oy >= 0 && ox < hsvMat.cols && oy < hsvMat.rows) {
                    let p = hsvMat.ucharPtr(oy, ox);
                    outerHueSum += p[0];
                    outerSatSum += p[1];
                    outerCount++;
                }
            }

            if (innerCount === 0 || outerCount === 0) return false;

            let innerSat = innerSatSum / innerCount;
            let outerSat = outerSatSum / outerCount;
            let outerHue = outerHueSum / outerCount;

            // Relaxed thresholds for far-away detection
            let isSilver = innerSat < 55;
            let isGold = outerSat > 35 && outerHue > 5 && outerHue < 45;

            return isSilver && isGold;
        }

        function onOpenCvReady() {
            cvReady = true;
            statusText.innerText = "OpenCV Loaded! Starting Camera...";
            startCamera();
        }
    </script>
</body>
</html>
